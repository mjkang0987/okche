# XcodeGen 설정. 고친 뒤 ios/ 에서 `xcodegen generate`로 Okche.xcodeproj를 다시 만든다.
name: Okche
options:
  bundleIdPrefix: app
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # 앱 기본 언어 한국어 — 시스템 버튼·날짜 형식이 영어로 나오지 않게.
  developmentLanguage: ko
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    # 저장소 맨 위 VERSION과 같아야 한다(OkcheTests가 확인).
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Okche:
    type: application
    platform: iOS
    sources:
      - Okche
      # 디자인 토큰은 복사하지 않고 생성 파일을 그대로 쓴다.
      - path: ../design/generated/OkcheTokens.swift
        group: Okche/Design
      # 고운바탕 글꼴과 라이선스(OFL은 글꼴과 함께 배포해야 함). 안드로이드와 같은 파일.
      - path: ../design/res/font/gowun_batang_bold.ttf
        group: Okche/Design
        buildPhase: resources
      - path: ../design/fonts/OFL-GowunBatang.txt
        group: Okche/Design
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.okche
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 옥체
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # 토큰이 밝은 한 벌뿐이라 어두운 모드를 쓰지 않는다.
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # 앱 아이콘은 아직 없음(뼈대 범위 밖).
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: Okche/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # iOS 26 유리 탭 막대 대신 디자인의 평평한 탭 막대. Apple은 다음 큰 버전에서 이 키를 없앤다고 함 — 그때 다시 정한다.
        UIDesignRequiresCompatibility: true
        UIAppFonts: [gowun_batang_bold.ttf]
        UILaunchScreen:
          UIColorName: Hanji
  OkcheTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OkcheTests
    dependencies:
      - target: Okche
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  OkcheUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - OkcheUITests
    dependencies:
      - target: Okche
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Okche
schemes:
  Okche:
    build:
      targets:
        Okche: all
        OkcheTests: [test]
        OkcheUITests: [test]
    test:
      targets:
        - OkcheTests
        - OkcheUITests
